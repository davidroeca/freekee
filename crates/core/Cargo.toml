[package]
name = "freekee-core"
description = "freekee orchestrator: vault open/save, rotation, audit invocation. See docs/design.md section 5."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kdbx = { path = "../kdbx" }
audit = { path = "../audit" }
thiserror.workspace = true
zeroize.workspace = true
chrono.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
# Used by PasswordPolicy::generate. Pulled in transitively via
# `keepass`, but listed directly so the dep graph is honest about
# what core uses.
getrandom = "0.3"
# Used by `tune::tune_argon2id` to benchmark candidate KDF params.
# Already a direct dep of `kdbx` (which constructs the upstream
# `KdfConfig::Argon2id`); listed here so `core` doesn't have to
# round-trip the timing through a kdbx accessor. Matches the kdbx
# pin shape.
rust-argon2 = "3.0"
# HIBP breached-password range query (A12). Blocking facade so the CLI
# needs no async runtime; rustls so we ship a pure-Rust TLS stack (no
# system OpenSSL). The single HTTP/TLS stack shared with the future
# Tauri/sync work, which also lives in `core`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "warn"
needless_collect = "warn"
