[package]
name = "cli"
description = "freekee command-line interface. See docs/design.md section 8."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "freekee"
path = "src/main.rs"

[dependencies]
freekee-core = { path = "../core" }
kdbx = { path = "../kdbx" }
audit = { path = "../audit" }
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
chrono.workspace = true
zeroize.workspace = true
rpassword.workspace = true
serde_json.workspace = true
arboard = "3"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
# `keepass` is used in `tests/secret_leakage.rs` to build a canary
# database with a sentinel entry password.
keepass.workspace = true

[features]
# Gates the final `keepassxc-cli db-info` step in
# `tests/cli_smoke_chain.rs`. CI on; local off unless `keepassxc-cli`
# 2.7+ is on PATH. Mirrors `crates/kdbx/Cargo.toml`'s gate of the
# same name.
keepassxc-verify = []

[lints]
workspace = true
